name: compile qr
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This repository deliberately stores every binary inline. Git LFS costs
      # bandwidth on each build and must never come back.
      - name: '🚫 Reject Git LFS'
        run: |
          if git grep -qI 'filter=lfs' HEAD -- .gitattributes; then
            echo "::error file=.gitattributes::Git LFS tracking re-introduced"
            exit 1
          fi
          pointers="$(git grep -lI '^version https://git-lfs\.github\.com/spec/' HEAD -- . || true)"
          if [ -n "$pointers" ]; then
            echo "::error::Git LFS pointer files committed:"
            echo "$pointers"
            exit 1
          fi

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages

      - name: '✅ Run the test suite'
        run: l3build check

      - name: '🔍 Upload the test output for inspection'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            build/test/*.pdf
            build/test/*.diff
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: tl_packages
      - run: pdflatex qr-example.tex
      - run: pdflatex qr-minimal.tex
      - run: pdflatex fancyqr-doc.tex
      - run: pdflatex fancyqr-doc.tex

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: poppler-utils
          version: 1.0

      - name: 'Generate previews'
        run: pdftoppm -png -r 300 -f 1 -l 1 qr-example.pdf preview

      # gh-pages is published as a single orphan commit holding nothing but the
      # generated artifacts. It is force-pushed, so the branch never accumulates
      # history and the repository stays small.
      - name: 'Publish artifacts to gh-pages'
        if: github.repository == 'EagleoutIce/fancyqr' && github.ref == 'refs/heads/main'
        run: |
          pages="$(mktemp -d)"
          cp qr-example.pdf fancyqr-doc.pdf preview-1.png "$pages/"
          cat > "$pages/README.md" <<'EOF'
          # fancyqr — generated artifacts

          This branch is generated automatically by the `compile qr` workflow on every
          push to `main`. It is force-pushed as a single orphan commit, so it carries no
          history and stays small.

          Do not commit here by hand — changes are overwritten on the next build.
          EOF
          cd "$pages"
          git init -q -b gh-pages
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -q -m "Newly compiled data"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: result
          path: |
            qr-example.pdf
            qr-minimal.pdf
            fancyqr-doc.pdf
            preview-1.png
